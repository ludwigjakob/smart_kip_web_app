<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperaturanzeige</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Navigationsmenü -->
  <nav>
    <a href="/" class="nav-link {% if active_page == 'home' %}active{% endif %}">🏠 Start</a>
    <a href="/analysis" class="nav-link {% if active_page == 'analysis' %}active{% endif %}">📊 Analyse</a>
    <a href="/config" class="nav-link {% if active_page == 'config' %}active{% endif %}">⚙️ Config</a>
  </nav>

  <h1>🌡️ Temperature</h1>
  <p id="temp">Load...</p>

  <script>
    async function fetchTemp() {
      const res = await fetch('/temperature');
      const data = await res.json();
      document.getElementById('temp').innerText = `${data.temperature} °C`;
    }
    fetchTemp();
    setInterval(fetchTemp, 5000);
  </script>

  <script src="/static/serviceworker.js"></script>
  
  <h1>🍃 Fan Control</h1>

    <p>Current Mode: <span id="mode-label">{{ mode }}</span></p>

    <button class="mode-button {% if mode == 'auto' %}active{% endif %}" id="auto-btn" onclick="setMode('auto')">Auto Mode</button>
    <button class="mode-button {% if mode == 'manual' %}active{% endif %}" id="manual-btn" onclick="setMode('manual')">Manual Mode</button>

    <script>
        function setMode(mode) {
            fetch('/set_mode', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ mode: mode })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('mode-label').textContent = data.mode;
                document.getElementById('auto-btn').classList.remove('active');
                document.getElementById('manual-btn').classList.remove('active');
                if (data.mode === 'auto') {
                    document.getElementById('auto-btn').classList.add('active');
                } else {
                    document.getElementById('manual-btn').classList.add('active');
                }
                toggleSliderVisibility(data.mode); // <== NEU
            });
        }
        let debounceTimer;

        function updateSliderLabel(value) {
          document.getElementById('slider-value').textContent = `${value}%`;

          clearTimeout(debounceTimer);
          debounceTimer = setTimeout(() => {
            fetch('/set_fan_speed', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ speed: value })
            });
          }, 2000); // 2 Sekunden Pause
        }

        function toggleSliderVisibility(mode) {
            const slider = document.getElementById('slider-container');
            slider.style.display = (mode === 'manual') ? 'block' : 'none';
            if (mode === 'manual') {
                const slider = document.getElementById('fan-slider');
                slider.value = 0;
                updateSliderLabel(0); // ← Übergibt den Wert an deine Funktion
            }
        }
    </script>
  <div id="slider-container" style="display: {% if mode == 'manual' %}block{% else %}none{% endif %}; margin-top: 20px;">
    <label for="fan-slider">Lüftergeschwindigkeit:</label>
    <input type="range" id="fan-slider" min="0" max="100" step="20" value="0" oninput="updateSliderLabel(this.value)">
    <span id="slider-value">0%</span>
  </div>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const initialMode = "{{ mode }}";
      toggleSliderVisibility(initialMode);
    });
  </script>
</body>
</html>
