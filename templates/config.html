<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfiguration</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Navigationsmenü -->
  <nav>
    <a href="/" class="nav-link {% if active_page == 'home' %}active{% endif %}">🏠 Start</a>
    <a href="/analysis" class="nav-link {% if active_page == 'analysis' %}active{% endif %}">📊 Analyse</a>
    <a href="/config" class="nav-link {% if active_page == 'config' %}active{% endif %}">⚙️ Config</a>
  </nav>
  <h1>⚙️ Konfiguration</h1>
  <p>Hier kannst du Schwellenwerte uvm.</p>
  <div class="threshold-card">
    <button type="button" class="toggle-button" onclick="toggleThresholds()">🌡️ Edit Thresholds</button>
    <div id="threshold-section" class="threshold-section">
      <form method="POST" action="/config" class="threshold-form">
        {% for level in [0, 20, 40, 60, 80] %}
          <div class="threshold-group">
            <label for="threshold_{{ level }}">🔧 {{ level }}% Threshold</label>
            <select name="threshold_{{ level }}" id="threshold_{{ level }}">
              {% for temp in range(15, 36) %}
                <option value="{{ temp }}" {% if thresholds.get(level) == temp %}selected{% endif %}>{{ temp }}°C</option>
              {% endfor %}
            </select>
          </div>
        {% endfor %}
        <button type="submit" class="save-button">💾 Save</button>
      </form>
    </div>
  </div>
  <script>
    function toggleThresholds() {
    const section = document.getElementById('threshold-section');
    const isHidden = window.getComputedStyle(section).display === 'none';
    section.style.display = isHidden ? 'block' : 'none';
  }
  </script>
</body>
</html>
