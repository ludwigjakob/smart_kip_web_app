<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfiguration</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Navigationsmenü -->
  <nav>
    <a href="/" class="nav-link {% if active_page == 'home' %}active{% endif %}">🏠 Start</a>
    <a href="/analysis" class="nav-link {% if active_page == 'analysis' %}active{% endif %}">📊 Analyse</a>
    <a href="/config" class="nav-link {% if active_page == 'config' %}active{% endif %}">⚙️ Config</a>
  </nav>
  <h1>⚙️ Konfiguration</h1>
  <p>Hier kannst du Schwellenwerte uvm.</p>
  <button onclick="toggleThresholds()">🌡️ Schwellenwerte bearbeiten</button>
    <div id="threshold-section" style="display: none; margin-top: 1em;">
      <form method="POST" action="/config">
        {% for level in [0, 20, 40, 60, 80] %}
          <label for="threshold_{{ level }}">Schwellenwert bei {{ level }}%:</label>
          <input type="number" step="0.1" name="threshold_{{ level }}" id="threshold_{{ level }}"
                value="{{ thresholds.get(level, '') }}" required><br>
        {% endfor %}
        <button type="submit">💾 Speichern</button>
      </form>
    </div>
  <script>
    function toggleThresholds() {
      const section = document.getElementById('threshold-section');
      section.style.display = section.style.display === 'none' ? 'block' : 'none';
    }
  </script>
</body>
</html>
